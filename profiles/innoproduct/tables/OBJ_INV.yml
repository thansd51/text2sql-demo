name: OBJ_INV
description: 상품 구조(상위-하위 오브젝트 관계)와 관계규칙을 저장한다. INV_TYPE으로 어떤 정보인지 구분한다
group: 상품
rules:
  - 상품 구조는 OBJ_INV(상위 SID, 하위 SUBSID)와 OBJINV_TYPE을 INV_TYPE으로 조인해서 조회하고, OBJINV_TYPE.TYPE_GBN으로 기본 상품구조(1), 서비스뷰(6), 관계규칙(4)을 구분한다
  - 관계규칙은 TYPE_GBN = 4인 행이다. 같은 규칙 세트는 SET_SEQ 값이 같다
  - OBJ_MAIN을 상위(SID)와 하위(SUBSID)로 두 번 조인할 때는 서로 다른 별칭을 쓴다 (예 T1, T3)
columns:
  - name: INV_TYPE
    type: number
    description: 관계 구분 ID. 저장된 행이 어떤 정보인지 구분한다 (OBJINV_TYPE.INV_TYPE)
    synonyms: [관계구분]
  - name: SID
    type: number
    description: 상위 오브젝트의 SID (OBJ_MAIN.SID)
    synonyms: [상위]
  - name: SUBSID
    type: number
    description: 하위 오브젝트의 SID (OBJ_MAIN.SID)
    synonyms: [하위]
  - name: SEQ
    type: number
    description: 순번
    synonyms: [순번, 순서]
  - name: VF_DT
    type: string
    description: 관계 구조 버전의 시작일자 (YYYYMMDD)
  - name: VT_DT
    type: string
    description: 관계 구조 버전의 종료일자 (YYYYMMDD, 99991231은 종료일 없음)
  - name: PROP_SID
    type: number
    description: 관계 오브젝트의 SID (OBJ_MAIN.SID). 상하 관계가 연결될 때 생성되는 관계 오브젝트의 실제 값이다
  - name: SET_SEQ
    type: number
    description: 관계규칙 SET 그룹 (0부터). 동일한 관계규칙이 여러 건일 때 같은 세트(화면에서는 같은 행)는 같은 값을 가진다
    synonyms: [세트, 세트순번]
  - name: BASIS
    type: number
    description: 관계 기준 여부 (1 = 기준, 0 = 기준 아님)
  - name: BASIS_YN
    type: string
    description: 관계 기준 여부 (Y = 기준, N = 기준 아님)
    synonyms: [기준여부]
  - name: REL_DESC
    type: string
    description: 보험 관계규칙의 설명
    synonyms: [규칙설명]
  - name: RULEID
    type: string
    description: 보험 관계규칙에 등록된 룰
    synonyms: [룰]
